version: 2
project_name: splitroute

builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:"]

# The Homebrew cask installs the macOS app (see the app job in release.yml).
